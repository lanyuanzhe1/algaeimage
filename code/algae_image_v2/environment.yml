# =============================================================================
# 藻类检测 V2 — Conda 环境定义文件
# =============================================================================
# 用途：在目标机器上一键复现精确的运行时环境
# 创建命令：conda env create -f environment.yml
# 更新命令：conda env update -f environment.yml --prune
#
# 关键依赖版本 (导出日期 2026-07-05)：
#   Python      3.11.11
#   PyTorch     2.11.0+cu126  (CUDA 12.6)
#   Ultralytics 8.4.48
#   FastAPI     0.136.3
# =============================================================================

name: ican

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # ── 运行时语言 ──────────────────────────────────────────────
  - python=3.11.11

  # ── 深度学习框架 (pytorch channel, 包含 CUDA 12.6) ─────────
  - pytorch::pytorch=2.11.0=py3.11_cuda12.6_cudnn9_0
  - pytorch::torchvision=0.26.0=py3.11_cu126

  # ── Web 框架与异步IO ────────────────────────────────────────
  - pip=25.0.1
  - pip:
      - fastapi==0.136.3
      - uvicorn[standard]==0.47.0
      - python-multipart==0.0.29
      - pydantic==2.10.3
      - pydantic-core==2.27.1
      - aiosqlite==0.22.1
      - aiofiles==25.1.0

  # ── 计算机视觉 ──────────────────────────────────────────────
  - pip:
      - opencv-python==4.13.0.92
      - Pillow==11.1.0
      - numpy==2.0.1

  # ── YOLO 检测 ───────────────────────────────────────────────
  - pip:
      - ultralytics==8.4.48
      - ultralytics-thop==2.0.19

  # ── 网络工具 ────────────────────────────────────────────────
  - pip:
      - requests==2.32.3

  # ── 测试 (可选) ─────────────────────────────────────────────
  - pip:
      - pytest>=7.0.0
      - httpx==0.28.1
